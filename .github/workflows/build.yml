name: Build and check resume

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [pdflatex, xelatex, lualatex]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install LaTeX and check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic \
            texlive-xetex texlive-luatex
          python3 -m pip install -r requirements-dev.txt
      - name: Build and check
        run: make check ENGINE=${{ matrix.engine }}
